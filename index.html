<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mālama Digital Care - Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <img src="images/logo.webp" alt="Mālama Digital Care" class="main-logo">
            <div class="nav-buttons">
                <span class="demo-badge clickable" onclick="window.location.href='index.html'" title="Return to start">DEMO</span>
            </div>
        </div>
    </header>

    <main class="landing-page">
        <div class="hero-section">
            <div class="hero-content">
                <h1 class="hero-title">Meet Michelle</h1>
                <p class="hero-subtitle">From confused to confident: Join Michelle on her digital transformation journey</p>
                <p class="hero-description">Click Michelle below to discover how Mālama Digital Care helps kūpuna thrive in the digital age</p>
            </div>

            <div class="michelle-container" onclick="startDemo()">
                <div class="image-wrapper">
                    <img src="images/confused-grandma-using-smart-phone-vector-illustration-white-background-cute-cartoon-character-74243429.webp" alt="Michelle - confused but ready to learn" class="michelle-image">
                    <div class="click-pulse"></div>
                </div>
                <div class="name-tag">
                    <span class="name">Michelle</span>
                    <span class="tagline">Ready to learn</span>
                </div>
            </div>

            <div class="cta-button-container">
                <button class="cta-button" onclick="startDemo()">
                    <span>Start Michelle's Journey</span>
                    <span class="arrow">→</span>
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
