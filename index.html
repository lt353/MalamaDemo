<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mālama Digital Care - Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <h1>Mālama Digital Care</h1>
            <span class="demo-badge">DEMO</span>
        </div>
    </header>

    <main class="landing-page">
        <div class="intro-text">
            <h2>Meet Michelle</h2>
            <p>Click to begin her digital journey</p>
        </div>

        <div class="michelle-container" onclick="startDemo()">
            <div class="michelle-character">
                <!-- Michelle's head -->
                <div class="head">
                    <div class="hair"></div>
                    <div class="face">
                        <div class="eyes">
                            <div class="eye left"></div>
                            <div class="eye right"></div>
                        </div>
                        <div class="nose"></div>
                        <div class="mouth"></div>
                        <div class="glasses">
                            <div class="lens left"></div>
                            <div class="lens right"></div>
                            <div class="bridge"></div>
                        </div>
                    </div>
                </div>
                <!-- Michelle's body -->
                <div class="body">
                    <div class="shoulders"></div>
                </div>
            </div>
            <div class="name-tag">Michelle</div>
        </div>

        <div class="cta-text">
            <p class="pulse">👆 Click Michelle to start the demo</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
