<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mālama Digital Care - Session Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <h1>Mālama Digital Care</h1>
            <span class="demo-badge">DEMO</span>
        </div>
    </header>

    <main class="session-detail-page">
        <button class="back-button" onclick="window.location.href='services.html'">← Back to Services</button>

        <div id="session-content">
            <!-- Content will be dynamically loaded -->
        </div>
    </main>

    <script src="session-data.js"></script>
    <script src="script.js"></script>
    <script>
        // Load session details on page load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session');
            if (sessionId) {
                loadSessionContent(sessionId);
            }
        });
    </script>
</body>
</html>
