<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mālama Digital Care - Session Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <img src="images/logo.webp" alt="Mālama Digital Care" class="main-logo">
            <div class="nav-buttons">
                <button class="nav-btn" onclick="window.history.back()" title="Go back one page">
                    <span>← Back</span>
                </button>
                <button class="nav-btn restart-btn" onclick="window.location.href='index.html'" title="Restart Michelle's journey">
                    <span>⟲ Restart Journey</span>
                </button>
                <span class="demo-badge clickable" onclick="window.location.href='index.html'" title="Return to start">DEMO</span>
            </div>
        </div>
    </header>

    <main class="session-detail-page">

        <div id="session-content">
            <!-- Content will be dynamically loaded -->
        </div>
    </main>

    <script src="session-data.js"></script>
    <script src="script.js"></script>
    <script>
        // Load session details on page load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session');
            if (sessionId) {
                loadSessionContent(sessionId);
            }
        });
    </script>
</body>
</html>
