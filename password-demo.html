<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Michelle's Password Journey - Mālama Digital Care</title>
    <link rel="stylesheet" href="mobile-demo-styles.css">
</head>
<body>
    <div id="mobile-demo-root">
        <!-- Loading state -->
        <div class="loading-screen" id="loading">
            <div style="text-align: center; padding: 3rem;">
                <h2 style="color: #2D9596; font-size: 2rem; margin-bottom: 1rem;">Loading Michelle's Journey...</h2>
                <div style="width: 50px; height: 50px; border: 5px solid #2D9596; border-top-color: transparent; border-radius: 50%; margin: 2rem auto; animation: spin 1s linear infinite;"></div>
            </div>
        </div>
    </div>

    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
    </style>

    <!-- Mobile Demo App - Vanilla JavaScript -->
    <script src="mobile-demo-vanilla.js"></script>
</body>
</html>
